# Quarkus config
quarkus.application.name=quarkus-applications
quarkus.devservices.enabled=false
quarkus.mcp.server.http.root-path=/mcp

# Datasource config
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/applications
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=test
quarkus.datasource.password=test
quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect

# Hibernate config
quarkus.hibernate-orm.database.generation=drop-and-create

# Logging config
quarkus.log.category."me.amiralles.applications".level=DEBUG
quarkus.log.level=INFO
quarkus.log.console.format=%d{HH:mm:ss} %-5p traceId=%X{traceId}, parentId=%X{parentId}, spanId=%X{spanId}, sampled=%X{sampled} [%c{2.}] (%t) %s%e%n
quarkus.log.console.level=DEBUG
%dev.quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
%dev.quarkus.log.console.level=DEBUG

# CORS for demo SPAs
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Accept,Mcp-Session-Id,MCP-Protocol-Version
quarkus.http.cors.exposed-headers=Mcp-Session-Id

# OpenTelemetry
quarkus.otel.service.name=applications-tools
quarkus.otel.exporter.otlp.traces.endpoint=http://localhost:4318
quarkus.otel.exporter.otlp.traces.protocol=http/protobuf
quarkus.otel.traces.sampler=always_on
quarkus.otel.traces.suppress-non-application-uris=false