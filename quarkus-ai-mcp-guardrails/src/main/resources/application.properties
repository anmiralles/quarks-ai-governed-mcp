# Quarkus config
quarkus.application.name=quarkus-ai-mcp-guardrails
quarkus.devservices.enabled=false

# gRPC server - the target of agentgateway's mcpGuardrails remote processor
quarkus.grpc.server.port=9001
quarkus.grpc.server.use-separate-server=false
quarkus.http.port=9001
quarkus.log.category."com.example.guardrail".level=DEBUG

# Logging config
quarkus.log.category."me.amiralles.guardrails".level=DEBUG
quarkus.log.level=INFO
quarkus.log.console.level=DEBUG
%dev.quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
